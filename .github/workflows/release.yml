name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.22.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK components
        run: |
          JDK17=$(ls -d /usr/lib/jvm/*17* 2>/dev/null | head -1)
          SDKMGR=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          echo "Using JDK17=$JDK17, sdkmanager=$SDKMGR"
          export JAVA_HOME="$JDK17"
          export PATH="$JAVA_HOME/bin:$PATH"
          CUSTOM_SDK="$HOME/vxp-android-sdk"
          mkdir -p "$CUSTOM_SDK/cmdline-tools"
          ln -s /usr/local/lib/android/sdk/cmdline-tools/latest "$CUSTOM_SDK/cmdline-tools/latest"
          "$SDKMGR" --sdk_root="$CUSTOM_SDK" --version
          yes | "$SDKMGR" --sdk_root="$CUSTOM_SDK" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$CUSTOM_SDK" --install "build-tools;28.0.3" "platforms;android-28" "ndk;19.2.5345600"
          echo "ANDROID_HOME=$CUSTOM_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$CUSTOM_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$CUSTOM_SDK/ndk/19.2.5345600" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x VirtualApp/gradlew

      - name: Decode release keystore
        env:
          KS_B64: ${{ secrets.VXP_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.VXP_KEY_ALIAS }}
          KS_KEY_PWD: ${{ secrets.VXP_KEY_PWD }}
          KS_STORE_PWD: ${{ secrets.VXP_STORE_PWD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "VXP_KEYSTORE_BASE64 未配置，跳过签名，产出未签名 APK（降级模式）。"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > VirtualApp/release.jks
          echo "keystore.path=release.jks" > VirtualApp/local.properties
          echo "keystore.alias=$KS_ALIAS" >> VirtualApp/local.properties
          echo "keystore.pwd=$KS_KEY_PWD" >> VirtualApp/local.properties
          echo "keystore.alias_pwd=$KS_STORE_PWD" >> VirtualApp/local.properties

      - name: Build signed aosp release APK
        working-directory: VirtualApp
        run: ./gradlew assembleAospRelease --no-daemon

      - name: Rename APK with tag
        id: apk
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p release-assets
          cp VirtualApp/app/build/outputs/apk/aosp/release/*.apk "release-assets/VirtualXposed-${TAG}.apk"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          ls -la release-assets/

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: VirtualXposed ${{ steps.apk.outputs.tag }}
          files: release-assets/*.apk
          body: |
            ## VirtualXposed ${{ steps.apk.outputs.tag }}

            免 Root 运行 Xposed 模块的 Android 虚拟化实现。

            ### 安装

            下载下方 `VirtualXposed-${{ steps.apk.outputs.tag }}.apk`，在 Android 5.0~10.0 设备上安装（arm64-v8a / x86_64）。

            > 若本版本为**未签名降级构建**（仓库未配置签名 Secret），Android 7+ 会拒绝安装（`INSTALL_PARSE_FAILED_NO_CERTIFICATES`），需自行用 apksigner 签名后再装。配置签名 Secret 后推 tag 即产签名 APK。

            ### 从源码构建

            见 [源码构建文档](https://android-security-engineer.github.io/VirtualXposed-skills/dev/build)。

            ### AI Agent 下载

            用 `gh release download ${{ steps.apk.outputs.tag }} --repo android-security-engineer/VirtualXposed-skills` 下载本版本 APK。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
