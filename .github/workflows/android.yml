name: Android CI

on:
  push:
    branches: [vxp, main]
    paths:
      - 'VirtualApp/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'VirtualApp/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/current/bin:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "build-tools;28.0.3" "platforms;android-28" "ndk;19.2.5345600"

      - name: Grant execute permission for gradlew
        run: chmod +x VirtualApp/gradlew

      - name: Decode release keystore
        env:
          KS_B64: ${{ secrets.VXP_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.VXP_KEY_ALIAS }}
          KS_KEY_PWD: ${{ secrets.VXP_KEY_PWD }}
          KS_STORE_PWD: ${{ secrets.VXP_STORE_PWD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "VXP_KEYSTORE_BASE64 未配置，跳过签名，产出未签名 APK（降级模式）。"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > VirtualApp/release.jks
          echo "keystore.path=release.jks" > VirtualApp/local.properties
          echo "keystore.alias=$KS_ALIAS" >> VirtualApp/local.properties
          echo "keystore.pwd=$KS_KEY_PWD" >> VirtualApp/local.properties
          echo "keystore.alias_pwd=$KS_STORE_PWD" >> VirtualApp/local.properties

      - name: Build aosp release APK
        working-directory: VirtualApp
        run: ./gradlew assembleAospRelease --no-daemon

      - name: Build fdroid release APK (unsigned fallback)
        working-directory: VirtualApp
        run: ./gradlew assembleFdroidRelease --no-daemon

      - name: Locate built APKs
        run: |
          find VirtualApp/app/build/outputs/apk -name "*.apk" -print
          mkdir -p artifacts
          cp VirtualApp/app/build/outputs/apk/aosp/release/*.apk artifacts/ 2>/dev/null || true
          cp VirtualApp/app/build/outputs/apk/fdroid/release/*.apk artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: virtualxposed-apk
          path: artifacts/*.apk
          retention-days: 30
