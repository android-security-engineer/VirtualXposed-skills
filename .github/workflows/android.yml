name: Android CI

on:
  push:
    branches: [vxp, main]
    paths:
      - 'VirtualApp/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'VirtualApp/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK components
        run: |
          # AGP 3.2.1's bundled sdklib cannot parse the new-schema repository XML
          # (base-extension / extension-level / "34x") of the runner's preinstalled
          # platforms (android-34+). Use a clean, separate ANDROID_HOME populated
          # only with the 2018-era components AGP 3.2.1 understands.
          JDK17=$(ls -d /usr/lib/jvm/*17* 2>/dev/null | head -1)
          SDKMGR=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          echo "Using JDK17=$JDK17, sdkmanager=$SDKMGR"
          export JAVA_HOME="$JDK17"
          export PATH="$JAVA_HOME/bin:$PATH"
          CUSTOM_SDK="$HOME/vxp-android-sdk"
          mkdir -p "$CUSTOM_SDK/cmdline-tools"
          ln -s /usr/local/lib/android/sdk/cmdline-tools/latest "$CUSTOM_SDK/cmdline-tools/latest"
          "$SDKMGR" --sdk_root="$CUSTOM_SDK" --version
          yes | "$SDKMGR" --sdk_root="$CUSTOM_SDK" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$CUSTOM_SDK" --install "build-tools;28.0.3" "platforms;android-28" "ndk;19.2.5345600"
          # Expose the clean SDK + pinned NDK (old layout for gradle-experimental) to gradle steps.
          echo "ANDROID_HOME=$CUSTOM_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$CUSTOM_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$CUSTOM_SDK/ndk/19.2.5345600" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x VirtualApp/gradlew

      - name: Decode release keystore
        env:
          KS_B64: ${{ secrets.VXP_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.VXP_KEY_ALIAS }}
          KS_KEY_PWD: ${{ secrets.VXP_KEY_PWD }}
          KS_STORE_PWD: ${{ secrets.VXP_STORE_PWD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "VXP_KEYSTORE_BASE64 未配置，跳过签名，产出未签名 APK（降级模式）。"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > VirtualApp/release.jks
          echo "keystore.path=release.jks" > VirtualApp/local.properties
          echo "keystore.alias=$KS_ALIAS" >> VirtualApp/local.properties
          echo "keystore.pwd=$KS_KEY_PWD" >> VirtualApp/local.properties
          echo "keystore.alias_pwd=$KS_STORE_PWD" >> VirtualApp/local.properties

      - name: Build aosp release APK
        working-directory: VirtualApp
        run: ./gradlew assembleAospRelease --no-daemon

      - name: Build fdroid release APK (unsigned fallback)
        working-directory: VirtualApp
        run: ./gradlew assembleFdroidRelease --no-daemon

      - name: Locate built APKs
        run: |
          find VirtualApp/app/build/outputs/apk -name "*.apk" -print
          mkdir -p artifacts
          cp VirtualApp/app/build/outputs/apk/aosp/release/*.apk artifacts/ 2>/dev/null || true
          cp VirtualApp/app/build/outputs/apk/fdroid/release/*.apk artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: virtualxposed-apk
          path: artifacts/*.apk
          retention-days: 30
